[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authprobe"
version = "0.1.0"
description = "Async HTTP login audit tool for authorized security testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
authprobe = "authprobe.cli:main"

[tool.setuptools]
packages = ["authprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
